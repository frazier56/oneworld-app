<style>
  :root{--ink:#0B0F1A;--teal:#5ED6EC}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--ink);color:#fff;font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  .stage{position:fixed;inset:0;display:grid;place-items:center}
  .frame{position:relative;height:100dvh;aspect-ratio:9/16;max-width:100vw}
  @supports not (height:100dvh){.frame{height:100vh}}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  .play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(11,15,26,.35);border:0;color:#fff;cursor:pointer;font:600 18px/1.2 inherit}
  .play span{display:grid;place-items:center;gap:14px}
  .play i{width:84px;height:84px;border-radius:50%;background:var(--teal);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .play i::before{content:"";margin-left:6px;border-left:26px solid var(--ink);border-top:16px solid transparent;border-bottom:16px solid transparent}
  .hot{position:absolute;left:20.09%;top:69.27%;width:59.81%;height:7.81%;border-radius:999px;display:none}
  .ended .hot{display:block;animation:pulse 1.6s ease-in-out infinite}
  .tapall{position:absolute;inset:0;display:none}
  .ended .tapall{display:block}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(94,214,236,.55)}50%{box-shadow:0 0 0 14px rgba(94,214,236,0)}}
  .skip{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));padding:8px 14px;border-radius:999px;background:rgba(11,15,26,.55);color:#fff;text-decoration:none;font:600 13px/1 inherit;backdrop-filter:blur(6px);display:none}
  .playing .skip{display:block}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="stage"><div class="frame" id="f">
  <video id="v" src="/v/agentes/onehome-agentes.mp4" poster="/v/agentes/poster.jpg" playsinline preload="metadata"></video>
  <button class="play" id="p" aria-label="Toca para ver"><span><i></i>Toca para ver</span></button>
  <a class="tapall" href="/join?next=%2Frentals%2Flist&lang=co&src=agent-video-es-r" aria-label="Haz clic aquí — Crea tu perfil hoy"></a>
  <a class="hot" href="/join?next=%2Frentals%2Flist&lang=co&src=agent-video-es-r"><span class="sr">Haz clic aquí — Crea tu perfil hoy</span></a>
  <a class="skip" href="/join?next=%2Frentals%2Flist&lang=co&src=agent-video-es-r">Crear mi perfil →</a>
</div></div>
<script>
  var v=document.getElementById('v'),f=document.getElementById('f'),p=document.getElementById('p');
  function go(){ try{ v.muted=false; var r=v.play(); if(r&&r.catch) r.catch(function(){ v.muted=true; v.play(); }); }catch(e){} p.style.display='none'; f.classList.add('playing'); }
  p.addEventListener('click',go);
  v.addEventListener('ended',function(){ f.classList.remove('playing'); f.classList.add('ended'); });
  v.addEventListener('click',function(){ if(v.paused) v.play(); else v.pause(); });
</script>
</body>
</html>
