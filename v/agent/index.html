<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OneHome agent videos</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0F1A">
<style>
  :root{--ink:#0B0F1A;--teal:#5ED6EC}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;background:var(--ink);color:#fff;font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px}
  h1{font-size:20px;font-weight:600;margin-bottom:16px}
  .g{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:560px}
  .c{display:block;color:#fff;text-decoration:none;border-radius:14px;overflow:hidden;background:#141a2a}
  .c img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover}
  .c b{display:block;padding:10px 12px 0;color:var(--teal);font-size:15px}
  .c span{display:block;padding:2px 12px 12px;font-size:13px;opacity:.8}
</style>
</head>
<body>
<h1>OneHome agent videos</h1>
<div class="g">
  <a class="c" href="/v/agent/es1/"><img src="/v/agentes/poster.jpg" alt="" loading="lazy"><b>ES1</b><span>Español · real</span></a>
  <a class="c" href="/v/agent/es2/"><img src="/v/agentes-a/poster.jpg" alt="" loading="lazy"><b>ES2</b><span>Español · animado</span></a>
  <a class="c" href="/v/agent/en1/"><img src="/v/agents/poster.jpg" alt="" loading="lazy"><b>EN1</b><span>English · real</span></a>
  <a class="c" href="/v/agent/en2/"><img src="/v/agents-a/poster.jpg" alt="" loading="lazy"><b>EN2</b><span>English · animated</span></a>
</div>
</body>
</html>
